<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban — __PROJECT_NAME__</title>
<style>
  :root { --bg:#f4f6f5; --card:#fff; --text:#1d2b25; --muted:#66756e; --border:#dde3e0;
          --accent:#1f9d6b; --todo:#d99a00; --prog:#2f7de1; --done:#1f9d6b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121816; --card:#1c2622; --text:#e8efec; --muted:#9aa8a2; --border:#2e3b36; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  h1 { font-size:1.2rem; margin:0; }
  .meta { color:var(--muted); font-size:.85rem; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .badge { padding:2px 8px; border-radius:99px; border:1px solid var(--border); font-size:.75rem; }
  .progress { width:160px; height:8px; background:var(--border); border-radius:99px; overflow:hidden; }
  .progress > div { height:100%; width:0; background:var(--done); transition:width .3s; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; padding:12px 20px; }
  .toolbar input[type=text] { flex:1 1 180px; }
  input[type=text], textarea { padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font:inherit; }
  button { padding:7px 12px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:hover { filter:brightness(.95); }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; padding:0 20px 24px; }
  .column { background:color-mix(in srgb, var(--card) 60%, transparent); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:180px; }
  .column.over { outline:2px dashed var(--accent); }
  .column h2 { font-size:.95rem; margin:4px 4px 10px; display:flex; justify-content:space-between; }
  .column[data-id=todo] h2 { color:var(--todo); } .column[data-id=in-progress] h2 { color:var(--prog); } .column[data-id=done] h2 { color:var(--done); }
  .task { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; cursor:grab; }
  .task.dragging { opacity:.4; }
  .task h3 { font-size:.95rem; margin:0 0 4px; }
  .task p { margin:0 0 8px; color:var(--muted); font-size:.85rem; white-space:pre-wrap; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .row button { padding:3px 8px; font-size:.8rem; }
  .time { font-variant-numeric:tabular-nums; font-size:.85rem; }
  .chip { font-size:.72rem; padding:1px 7px; border-radius:99px; background:color-mix(in srgb, var(--accent) 18%, transparent); }
  dialog { border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); width:min(420px,92vw); }
  dialog form { display:grid; gap:10px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>📋 Kanban — <span id="name"></span></h1>
    <div class="meta">
      <span class="badge" id="mode"></span>
      <span id="count"></span>
      <span id="total-time"></span>
    </div>
  </div>
  <div class="progress" title="Avancement"><div id="bar"></div></div>
</header>

<div class="toolbar">
  <input type="text" id="new-title" placeholder="Nouvelle tâche…" maxlength="200">
  <input type="text" id="new-desc" placeholder="Description (facultatif)" maxlength="500">
  <button class="primary" id="add">Ajouter</button>
  <button id="export">Exporter JSON</button>
  <button id="import">Importer JSON</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>

<main class="board" id="board"></main>

<dialog id="edit">
  <form method="dialog" id="edit-form">
    <h3>Modifier la tâche</h3>
    <input type="text" id="edit-title" maxlength="200" required>
    <textarea id="edit-desc" rows="4" maxlength="2000"></textarea>
    <div class="row">
      <button class="primary" value="ok">Enregistrer</button>
      <button value="cancel" formnovalidate>Annuler</button>
    </div>
  </form>
</dialog>

<script>
  const NAME = '__PROJECT_NAME__';
  const COLUMNS = [
    { id: 'todo', titre: 'À faire' },
    { id: 'in-progress', titre: 'En cours' },
    { id: 'done', titre: 'Terminé' },
  ];
  const LS_KEY = 'germin-kanban:' + NAME;
  let tasks = [];
  let server_mode = false;
  let running = null;
  let dragging = false;
  let editing = null;
  let save_timer = null;

  const $ = (id) => document.getElementById(id);
  const fmt = (s) => {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const p = (n) => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + p(m) + ':' + p(sec);
  };
  const next_id = () => Math.max(0, ...tasks.map((t) => t.id)) + 1;

  async function load() {
    try {
      const res = await fetch('/api/tasks');
      if (!res.ok) throw new Error('pas de serveur');
      tasks = await res.json();
      server_mode = true;
    } catch (e) {
      server_mode = false;
      try { tasks = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (_) { tasks = []; }
    }
    $('mode').textContent = server_mode
      ? '🟢 connecté à x/task.json'
      : '🟠 hors serveur (sauvegarde navigateur) — lance « germin kanban »';
  }

  function save_now() {
    clearTimeout(save_timer);
    if (server_mode) {
      fetch('/api/tasks', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tasks) })
        .catch(() => {});
    } else {
      try { localStorage.setItem(LS_KEY, JSON.stringify(tasks)); } catch (_) {}
    }
  }
  function save() { clearTimeout(save_timer); save_timer = setTimeout(save_now, 150); }

  function move(task, delta) {
    const i = COLUMNS.findIndex((c) => c.id === task.label) + delta;
    if (i >= 0 && i < COLUMNS.length) {
      task.label = COLUMNS[i].id;
      if (task.label === 'done' && running === task.id) running = null;
      save(); render();
    }
  }

  function button(text, title, on_click) {
    const b = document.createElement('button');
    b.textContent = text; b.title = title; b.type = 'button';
    b.addEventListener('click', on_click);
    return b;
  }

  function card(task) {
    const el = document.createElement('article');
    el.className = 'task'; el.draggable = true; el.dataset.id = task.id;
    el.addEventListener('dragstart', (e) => { dragging = true; el.classList.add('dragging'); e.dataTransfer.setData('text/plain', String(task.id)); });
    el.addEventListener('dragend', () => { dragging = false; el.classList.remove('dragging'); });

    const h = document.createElement('h3'); h.textContent = task.title; el.appendChild(h);
    if (task.description) { const p = document.createElement('p'); p.textContent = task.description; el.appendChild(p); }

    const info = document.createElement('div'); info.className = 'row';
    const t = document.createElement('span'); t.className = 'time'; t.id = 'time-' + task.id; t.textContent = '⏱ ' + fmt(task.time);
    info.appendChild(t);
    if (task.test) {
      const c = document.createElement('span'); c.className = 'chip';
      c.textContent = (task.label === 'done' ? '✅ ' : '🧪 ') + task.test; c.title = 'Tâche liée au test « ' + task.test + ' »';
      info.appendChild(c);
    }
    el.appendChild(info);

    const actions = document.createElement('div'); actions.className = 'row'; actions.style.marginTop = '8px';
    actions.appendChild(button('◀', 'Colonne précédente', () => move(task, -1)));
    actions.appendChild(button('▶', 'Colonne suivante', () => move(task, 1)));
    actions.appendChild(button(running === task.id ? '⏸' : '▶︎ chrono', 'Démarrer / arrêter le chronomètre', () => {
      running = running === task.id ? null : task.id; save_now(); render();
    }));
    actions.appendChild(button('✏️', 'Modifier', () => {
      editing = task; $('edit-title').value = task.title; $('edit-desc').value = task.description; $('edit').showModal();
    }));
    actions.appendChild(button('🗑', 'Supprimer', () => {
      if (confirm('Supprimer cette tâche ?')) { tasks = tasks.filter((x) => x.id !== task.id); if (running === task.id) running = null; save(); render(); }
    }));
    el.appendChild(actions);
    return el;
  }

  function render() {
    const board = $('board'); board.textContent = '';
    COLUMNS.forEach((col) => {
      const list = tasks.filter((t) => t.label === col.id);
      const c = document.createElement('section'); c.className = 'column'; c.dataset.id = col.id;
      const h = document.createElement('h2');
      const a = document.createElement('span'); a.textContent = col.titre;
      const b = document.createElement('span'); b.textContent = list.length;
      h.append(a, b); c.appendChild(h);
      list.forEach((t) => c.appendChild(card(t)));
      c.addEventListener('dragover', (e) => { e.preventDefault(); c.classList.add('over'); });
      c.addEventListener('dragleave', () => c.classList.remove('over'));
      c.addEventListener('drop', (e) => {
        e.preventDefault(); c.classList.remove('over');
        const t = tasks.find((x) => x.id === Number(e.dataTransfer.getData('text/plain')));
        if (t) { t.label = col.id; if (col.id === 'done' && running === t.id) running = null; save(); render(); }
      });
      board.appendChild(c);
    });
    const done = tasks.filter((t) => t.label === 'done').length;
    $('name').textContent = NAME;
    $('count').textContent = done + ' / ' + tasks.length + ' terminées';
    $('bar').style.width = (tasks.length ? Math.round((done / tasks.length) * 100) : 0) + '%';
    update_total();
  }

  function update_total() {
    $('total-time').textContent = '⏱ total ' + fmt(tasks.reduce((s, t) => s + t.time, 0));
  }

  $('add').addEventListener('click', () => {
    const title = $('new-title').value.trim();
    if (!title) return $('new-title').focus();
    tasks.push({ id: next_id(), title, description: $('new-desc').value.trim(), label: 'todo', time: 0 });
    $('new-title').value = ''; $('new-desc').value = ''; save(); render();
  });
  $('new-title').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('add').click(); });

  $('edit-form').addEventListener('submit', (e) => {
    if (e.submitter && e.submitter.value === 'ok' && editing) {
      editing.title = $('edit-title').value.trim() || editing.title;
      editing.description = $('edit-desc').value.trim();
      save(); render();
    }
    editing = null;
  });

  $('export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tasks.json'; a.click();
    URL.revokeObjectURL(a.href);
  });
  $('import').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('tableau attendu');
        let added = 0;
        data.forEach((t) => {
          if (t && typeof t.title === 'string' && t.title.trim() && !tasks.some((x) => x.title === t.title)) {
            tasks.push({ id: next_id(), title: t.title.trim().slice(0, 200), description: typeof t.description === 'string' ? t.description.slice(0, 2000) : '',
              label: COLUMNS.some((c) => c.id === t.label) ? t.label : 'todo', time: Number.isFinite(t.time) && t.time >= 0 ? Math.floor(t.time) : 0,
              ...(typeof t.test === 'string' && t.test ? { test: t.test } : {}) });
            added++;
          }
        });
        save(); render();
        if (!added) alert('Aucune nouvelle tâche ajoutée (déjà présentes ou invalides).');
      } catch (err) { alert('Fichier JSON invalide : un tableau de tâches est attendu.'); }
    };
    reader.readAsText(file); e.target.value = '';
  });

  setInterval(() => {
    if (running === null) return;
    const t = tasks.find((x) => x.id === running);
    if (!t) { running = null; return; }
    t.time += 1;
    const el = $('time-' + t.id); if (el) el.textContent = '⏱ ' + fmt(t.time);
    update_total();
    if (t.time % 10 === 0) save_now();
  }, 1000);

  // Recharge le fichier quand « germin test » met à jour les tâches
  setInterval(async () => {
    if (!server_mode || dragging || $('edit').open) return;
    try {
      const res = await fetch('/api/tasks'); if (!res.ok) return;
      const remote = await res.json();
      remote.forEach((r) => { if (r.id === running) { const l = tasks.find((x) => x.id === r.id); if (l) r.time = l.time; } });
      if (JSON.stringify(remote) !== JSON.stringify(tasks)) { tasks = remote; render(); }
    } catch (_) {}
  }, 4000);

  load().then(render);
</script>
</body>
</html>
